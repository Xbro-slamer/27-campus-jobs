<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>27届校招岗位汇总</title>
<script src="xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#f5f7fa;color:#1a1a2e;line-height:1.6}
.container{max-width:1400px;margin:0 auto;padding:0 16px}
.header{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 0;position:sticky;top:0;z-index:100}
.header .c{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{font-size:1.1rem}
.header .ver{font-size:.7rem;color:#999;margin-left:8px}
.stats{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.stats .s{flex:1;min-width:90px;background:#fff;border-radius:8px;padding:10px 14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stats .s .n{font-size:1.4rem;font-weight:700}
.stats .s .l{font-size:.7rem;color:#888}
.fbar{background:#fff;border-radius:8px;padding:12px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbar input[type=text]{flex:1;min-width:160px;padding:7px 12px;border:1px solid #e2e8f0;border-radius:20px;font-size:.82rem}
.fbar select{padding:6px 10px;border:1px solid #e2e8f0;border-radius:20px;font-size:.78rem;background:#fff}
.fbar button{padding:6px 14px;border:1px solid #e2e8f0;border-radius:20px;font-size:.78rem;background:#fff;cursor:pointer;white-space:nowrap}
.fbar button:hover{border-color:#4f46e5;color:#4f46e5}
.fbar button.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:4px}
.tag-row .lbl{font-size:.75rem;font-weight:600;color:#888;white-space:nowrap;min-width:44px}
.tag{font-size:.73rem;padding:3px 10px;border:1px solid #e2e8f0;border-radius:14px;cursor:pointer;background:#fff;white-space:nowrap}
.tag:hover{border-color:#4f46e5;color:#4f46e5}
.tag.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
.info{font-size:.78rem;color:#888;margin:8px 0;display:flex;justify-content:space-between}
.tbl{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tbl table{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th{background:#eef2ff;padding:8px 10px;text-align:left;font-size:.75rem;color:#666;cursor:pointer}
.tbl td{padding:7px 10px;border-bottom:1px solid #f0f0f0}
.tbl tr:hover td{background:#f8faff}
.row-soon{background:#fffbeb}
.row-ended{background:#fef2f2;opacity:.55}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.dot.g{background:#10b981}.dot.y{background:#f59e0b}.dot.r{background:#ef4444}
.btn-sm{padding:3px 12px;border-radius:14px;font-size:.73rem;font-weight:600;border:none;cursor:pointer;text-decoration:none}
.btn-go{background:#4f46e5;color:#fff}
.btn-go:hover{opacity:.85}
.btn-fav{background:none;border:none;cursor:pointer;font-size:1rem}
.admin-bar{display:none;background:#fffbe6;border:2px solid #f59e0b;border-radius:8px;padding:14px 18px;margin-bottom:10px}
.admin-bar h3{font-size:.95rem;margin-bottom:8px}
.admin-bar .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.admin-bar input,.admin-bar select{padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:.8rem}
.admin-bar .up-zone{border:2px dashed #e2e8f0;border-radius:8px;padding:24px;text-align:center;cursor:pointer;margin:8px 0}
.admin-bar .up-zone:hover{border-color:#4f46e5;background:#f8f8ff}
.footer{text-align:center;padding:16px;font-size:.7rem;color:#999;margin-top:16px;border-top:1px solid #e2e8f0}
.empty{text-align:center;padding:60px;color:#999}
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:8px;font-size:.82rem;z-index:9999}
.card-grid{display:none;gap:10px;margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card .ch{display:flex;justify-content:space-between;margin-bottom:6px}
.card .cname{font-weight:700}
.card .ctitle{font-size:.85rem;margin-bottom:6px}
.card .cmeta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.card .cmeta span{font-size:.72rem;padding:2px 8px;background:#f5f7fa;border-radius:10px;color:#888}
.card .cf{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid #f0f0f0}
@media(max-width:768px){.card-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="c container">
    <div><h1>🎓 27届校招岗位汇总<span class="ver">v3.8</span></h1></div>
    <div style="display:flex;gap:6px;align-items:center">
      <button onclick="toggleView()" id="viewBtn" style="font-size:.78rem;padding:5px 12px;border:1px solid #e2e8f0;border-radius:20px;background:#fff;cursor:pointer">🃏 卡片</button>
      <button onclick="toggleAdmin()" style="font-size:.78rem;padding:5px 12px;border:1px solid #4f46e5;border-radius:20px;background:#4f46e5;color:#fff;cursor:pointer">⚙️ 管理</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="stats" id="stats"></div>

  <!-- ADMIN PANEL -->
  <div class="admin-bar" id="adminBar">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3>⚙️ 后台管理</h3>
      <div style="display:flex;gap:6px">
        <button onclick="showAddForm()" style="background:#4f46e5;color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.78rem">➕ 新增岗位</button>
        <button onclick="batchUpdateDead()" style="background:#f59e0b;color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.78rem">🔄 刷新截止状态</button>
        <button onclick="exportJSON()" style="background:#10b981;color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.78rem">💾 导出数据</button>
        <button onclick="toggleAdmin()" style="border:none;background:none;cursor:pointer;font-size:1.2rem">✕</button>
      </div>
    </div>
    <div style="margin-bottom:6px"><strong>📥 导入岗位：</strong>
      <button onclick="document.getElementById('fileInput').click()" style="background:#4f46e5;color:#fff;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:.82rem;margin-left:4px">📁 导入 Excel / CSV</button>
      <span style="font-size:.73rem;color:#888;margin-left:6px">支持 .xlsx .xls .csv 拖拽上传</span>
    </div>
    <div class="up-zone" id="dropZone">
      <div style="font-size:2rem">📁</div>
      <p>拖拽 Excel 文件到这里，或点击选择文件</p>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.json,.js" style="display:none" onchange="handleFile(this.files[0])">
    </div>
    <div id="importMsg" style="font-size:.78rem;color:#10b981;margin-top:4px"></div>
    <div style="margin-top:10px"><strong>📋 岗位管理：</strong>（下方表格每行有编辑/删除按钮）</div>
  </div>

  <!-- FILTERS -->
  <div class="fbar">
    <input type="text" id="search" placeholder="🔍 搜索公司/岗位...">
    <select id="sortBy"><option value="deadline">⏰ 截止升序</option><option value="-deadline">截止降序</option><option value="company">公司 A-Z</option></select>
    <button onclick="toggleFav()" id="favBtn">⭐ 收藏</button>
    <button onclick="doExport()">📥 导出</button>
    <button onclick="resetAll()">🔄 重置</button>
    <button onclick="document.getElementById('fileInput').click()" style="background:#10b981;color:#fff;border-color:#10b981">📁 导入Excel</button>
  </div>
  <div class="tag-row"><span class="lbl">类别：</span><span id="catTags"></span></div>
  <div class="tag-row"><span class="lbl">城市：</span><span id="cityTags"></span></div>
  <div class="tag-row"><span class="lbl">状态：</span><span id="statusTags"></span></div>

  <div class="info"><span id="resultInfo">共 0 条</span></div>

  <!-- TABLE -->
  <div class="tbl" id="tableView"><table><thead><tr>
    <th>⭐</th><th>公司</th><th>岗位</th><th>类别</th><th>城市</th><th>学历</th><th onclick="setSort('deadline')">截止 ▾</th><th>状态</th><th>操作</th>
  </tr></thead><tbody id="tbody"></tbody></table></div>

  <!-- CARDS -->
  <div class="card-grid" id="cardView"></div>
  <div class="empty" id="empty" style="display:none">🔍 没有匹配的岗位</div>
</div>

<div class="footer">数据来源各企业官网 | 仅供参考 | v3.0</div>

<!-- ADD/EDIT FORM MODAL -->
<div id="formModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:10px;padding:20px;max-width:500px;width:100%;max-height:90vh;overflow:auto">
    <h3 id="formTitle">新增岗位</h3>
    <div style="margin:8px 0"><label style="font-size:.8rem;font-weight:600">公司 *</label><input id="fCompany" style="width:100%;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:.85rem;margin-top:2px"></div>
    <div style="margin:8px 0"><label style="font-size:.8rem;font-weight:600">岗位 *</label><input id="fTitle" style="width:100%;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:.85rem;margin-top:2px"></div>
    <div style="display:flex;gap:8px">
      <div style="flex:1;margin:8px 0"><label style="font-size:.8rem;font-weight:600">类别</label><input id="fCat" style="width:100%;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:.85rem;margin-top:2px" placeholder="算法"></div>
      <div style="flex:1;margin:8px 0"><label style="font-size:.8rem;font-weight:600">城市</label><input id="fCity" style="width:100%;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:.85rem;margin-top:2px" placeholder="北京"></div>
    </div>
    <div style="display:flex;gap:8px">
      <div style="flex:1;margin:8px 0"><label style="font-size:.8rem;font-weight:600">学历</label><select id="fEdu" style="width:100%;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:.85rem;margin-top:2px"><option>本科及以上</option><option>硕士及以上</option><option>博士</option><option>不限</option></select></div>
      <div style="flex:1;margin:8px 0"><label style="font-size:.8rem;font-weight:600">截止时间</label><input type="date" id="fDeadline" style="width:100%;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:.85rem;margin-top:2px"></div>
    </div>
    <div style="margin:8px 0"><label style="font-size:.8rem;font-weight:600">投递链接 *</label><input id="fLink" style="width:100%;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:.85rem;margin-top:2px" placeholder="https://"></div>
    <div style="margin:8px 0"><label style="font-size:.8rem;font-weight:600">内推码</label><input id="fRef" style="width:100%;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:.85rem;margin-top:2px"></div>
    <input type="hidden" id="fIndex" value="-1">
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button onclick="closeForm()" style="padding:7px 16px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;font-size:.82rem">取消</button>
      <button onclick="saveJob()" style="padding:7px 16px;background:#4f46e5;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.82rem">保存</button>
    </div>
  </div>
</div>

<script src="jobs-data.js"></script>
<script>
// ===== DATA =====
var DATA = JSON.parse(JSON.stringify(JOBS_DATA));
// Normalize existing categories
DATA.forEach(function(j){j.category=normCat(j.category);});
var FILTERS = {search:'',cats:new Set(),cities:new Set(),status:new Set(),sort:'deadline',favs:new Set(),favOnly:false,view:'table',admin:false};
try{var s=JSON.parse(localStorage.campus_v3||'{}');if(s.favs)FILTERS.favs=new Set(s.favs);if(s.favOnly)FILTERS.favOnly=s.favOnly;if(s.view)FILTERS.view=s.view;}catch(e){}
function save(){var o={favs:[...FILTERS.favs],favOnly:FILTERS.favOnly,view:FILTERS.view};localStorage.campus_v3=JSON.stringify(o);}

// ===== HELPERS =====
function daysLeft(j){var n=new Date;n.setHours(0,0,0,0);var d=new Date(j.deadline);d.setHours(0,0,0,0);return Math.ceil((d-n)/86400000);}
function getStatus(j){var d=daysLeft(j);if(d<0)return'已截止';if(d<=7)return'即将截止';return'可投';}

// ===== RENDER =====
function buildCatTags(){
  var cats=[...new Set(DATA.map(function(j){return j.category;}))].sort();
  var h='<span class="tag on" data-v="all" onclick="toggleTag(this,\'cats\')">全部</span>';
  cats.forEach(function(c){h+='<span class="tag" data-v="'+c+'" onclick="toggleTag(this,\'cats\')">'+c+'</span>';});
  document.getElementById('catTags').innerHTML=h;
}
function buildCityTags(){
  var cities=['北京','上海','深圳','广州','杭州','成都','南京','武汉','西安','苏州','重庆','长沙','天津','合肥','厦门','珠海','东莞','佛山','全国'];
  var h='<span class="tag on" data-v="all" onclick="toggleTag(this,\'cities\')">全部</span>';
  cities.forEach(function(c){
    var n=DATA.filter(function(j){return j.city.indexOf(c)>=0;}).length;
    h+='<span class="tag" data-v="'+c+'" onclick="toggleTag(this,\'cities\')">'+c+'('+n+')</span>';
  });
  document.getElementById('cityTags').innerHTML=h;
}
function toggleTag(el,key){
  var v=el.dataset.v;
  if(v==='all'){FILTERS[key].clear();var p=el.parentElement;var tags=p.querySelectorAll('.tag');tags.forEach(function(t){t.classList.remove('on');});el.classList.add('on');}
  else{
    if(FILTERS[key].has(v)){FILTERS[key].delete(v);el.classList.remove('on');if(FILTERS[key].size===0)el.parentElement.querySelector('[data-v="all"]').classList.add('on');}
    else{FILTERS[key].add(v);el.classList.add('on');el.parentElement.querySelector('[data-v="all"]').classList.remove('on');}
  }
  refresh();
}

function getFiltered(){
  var f=DATA.slice();
  if(FILTERS.search){var q=FILTERS.search.toLowerCase();f=f.filter(function(j){return j.company.toLowerCase().indexOf(q)>=0||j.title.toLowerCase().indexOf(q)>=0;});}
  if(FILTERS.cats.size>0)f=f.filter(function(j){return FILTERS.cats.has(j.category);});
  if(FILTERS.cities.size>0)f=f.filter(function(j){var self=this;return [...FILTERS.cities].some(function(c){return j.city.indexOf(c)>=0;});});
  if(FILTERS.status.size>0)f=f.filter(function(j){return FILTERS.status.has(getStatus(j));});
  if(FILTERS.favOnly)f=f.filter(function(j){return FILTERS.favs.has(j.company+'|'+j.title);});
  if(FILTERS.sort==='deadline')f.sort(function(a,b){return new Date(a.deadline)-new Date(b.deadline);});
  else if(FILTERS.sort==='-deadline')f.sort(function(a,b){return new Date(b.deadline)-new Date(a.deadline);});
  else if(FILTERS.sort==='company')f.sort(function(a,b){return a.company.localeCompare(b.company,'zh');});
  return f;
}

function refresh(){
  var jobs=getFiltered();
  document.getElementById('resultInfo').textContent='共 '+jobs.length+' 条岗位';
  var total=DATA.length,open=DATA.filter(function(j){return getStatus(j)==='可投';}).length;
  var soon=DATA.filter(function(j){return getStatus(j)==='即将截止';}).length;
  var ended=DATA.filter(function(j){return getStatus(j)==='已截止';}).length;
  document.getElementById('stats').innerHTML='<div class="s"><div class="n">'+total+'</div><div class="l">📋 总数</div></div><div class="s"><div class="n" style="color:#10b981">'+open+'</div><div class="l">🟢 可投</div></div><div class="s"><div class="n" style="color:#f59e0b">'+soon+'</div><div class="l">🟡 将截止</div></div><div class="s"><div class="n" style="color:#ef4444">'+ended+'</div><div class="l">🔴 已截止</div></div><div class="s"><div class="n" style="color:#f59e0b">'+FILTERS.favs.size+'</div><div class="l">⭐ 收藏</div></div>';

  var isTable=FILTERS.view==='table';
  document.getElementById('tableView').style.display=isTable?'':'none';
  document.getElementById('cardView').style.display=isTable?'none':'grid';
  document.getElementById('empty').style.display=jobs.length?'none':'';
  document.getElementById('viewBtn').textContent=isTable?'🃏 卡片':'📋 表格';

  if(isTable)renderTable(jobs);else renderCards(jobs);
  save();
}

function renderTable(jobs){
  var h='';
  for(var i=0;i<jobs.length;i++){
    var j=jobs[i],st=getStatus(j),d=daysLeft(j),k=j.company+'|'+j.title;
    var rc=st==='即将截止'?'row-soon':st==='已截止'?'row-ended':'';
    var cd=d>=0?(d<=7?'<span style="color:#ef4444;font-size:.7rem;margin-left:4px">剩'+d+'天</span>':'<span style="color:#999;font-size:.7rem;margin-left:4px">剩'+d+'天</span>'):'';
    var star=FILTERS.favs.has(k)?'⭐':'☆';
    h+='<tr class="'+rc+'"><td><button class="btn-fav" onclick="fav(\''+k+'\')">'+star+'</button></td>';
    h+='<td><b>'+esc(j.company)+'</b></td><td>'+esc(j.title)+'</td><td>'+esc(j.category)+'</td><td>'+esc(j.city)+'</td><td>'+esc(j.education)+'</td>';
    h+='<td>'+j.deadline+cd+'</td>';
    h+='<td><span class="dot '+(st==='可投'?'g':st==='即将截止'?'y':'r')+'"></span>'+st+'</td>';
    h+='<td>';
    if(j.link) h+='<a href="'+esc(j.link)+'" target="_blank" class="btn-sm btn-go">📝 投递</a> ';
    if(FILTERS.admin) h+='<button class="btn-sm" style="background:#f0f0f0;margin-left:4px" onclick="editJob('+DATA.indexOf(j)+')">✏️</button> <button class="btn-sm" style="background:#fef2f2;color:#ef4444" onclick="delJob('+DATA.indexOf(j)+')">🗑</button>';
    h+='</td></tr>';
  }
  document.getElementById('tbody').innerHTML=h;
}

function renderCards(jobs){
  var h='';
  for(var i=0;i<jobs.length;i++){
    var j=jobs[i],st=getStatus(j),d=daysLeft(j),k=j.company+'|'+j.title;
    var cd=d>=0?(d<=7?'⚡剩'+d+'天':'剩'+d+'天'):'';
    h+='<div class="card"><div class="ch"><b class="cname">'+esc(j.company)+'</b><button class="btn-fav" onclick="fav(\''+k+'\')">'+(FILTERS.favs.has(k)?'⭐':'☆')+'</button></div>';
    h+='<div class="ctitle">'+esc(j.title)+'</div><div class="cmeta"><span>📂 '+esc(j.category)+'</span><span>📍 '+esc(j.city)+'</span><span>🎓 '+esc(j.education)+'</span><span>📅 '+j.deadline+' '+cd+'</span></div>';
    h+='<div class="cf"><span><span class="dot '+(st==='可投'?'g':st==='即将截止'?'y':'r')+'"></span>'+st+'</span>';
    if(j.link) h+='<a href="'+esc(j.link)+'" target="_blank" class="btn-sm btn-go">📝 投递</a>';
    h+='</div></div>';
  }
  document.getElementById('cardView').innerHTML=h;
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// Category normalization
function normCat(c){
  if(!c)return'其他';
  var s=c.toString().toLowerCase();
  if(s.indexOf('算法')>=0||s.indexOf('alg')>=0)return'算法';
  if(s.indexOf('开发')>=0||s.indexOf('研发')>=0||s.indexOf('前端')>=0||s.indexOf('后端')>=0||s.indexOf('全栈')>=0||s.indexOf('软件')>=0||s.indexOf('java')>=0||s.indexOf('c++')>=0)return'开发';
  if(s.indexOf('硬件')>=0||s.indexOf('芯片')>=0||s.indexOf('ic')>=0||s.indexOf('电路')>=0||s.indexOf('fpga')>=0)return'硬件';
  if(s.indexOf('嵌入式')>=0)return'嵌入式';
  if(s.indexOf('产品')>=0)return'产品';
  if(s.indexOf('运营')>=0)return'运营';
  if(s.indexOf('测试')>=0)return'测试';
  if(s.indexOf('设计')>=0||s.indexOf('美术')>=0||s.indexOf('ui')>=0||s.indexOf('ux')>=0||s.indexOf('原画')>=0)return'设计';
  if(s.indexOf('市场')>=0||s.indexOf('营销')>=0||s.indexOf('销售')>=0||s.indexOf('投放')>=0)return'市场';
  if(s.indexOf('职能')>=0||s.indexOf('人力')>=0||s.indexOf('hr')>=0||s.indexOf('行政')>=0||s.indexOf('财务')>=0||s.indexOf('法务')>=0)return'职能';
  if(s.indexOf('机械')>=0||s.indexOf('结构')>=0)return'机械结构';
  if(s.indexOf('数据')>=0)return'数据';
  if(s.indexOf('安全')>=0)return'安全';
  if(s.indexOf('供应链')>=0||s.indexOf('采购')>=0||s.indexOf('物流')>=0)return'供应链';
  if(s.indexOf('项目')>=0)return'项目管理';
  if(s.indexOf('策划')>=0||s.indexOf('游戏')>=0)return'游戏策划';
  return'其他';
}

// ===== IMPORT =====
document.getElementById('dropZone').onclick=function(){document.getElementById('fileInput').click();};
document.getElementById('dropZone').ondragover=function(e){e.preventDefault();this.style.background='#f0f0ff';};
document.getElementById('dropZone').ondragleave=function(){this.style.background='';};
document.getElementById('dropZone').ondrop=function(e){e.preventDefault();this.style.background='';handleFile(e.dataTransfer.files[0]);};

function handleFile(file){
  if(!file)return;
  var name=file.name.toLowerCase();
  document.getElementById('importMsg').textContent='正在解析...';
  
  // Excel files
  if(name.endsWith('.xlsx')||name.endsWith('.xls')){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        var jobs=[];
        wb.SheetNames.forEach(function(sn){
          var ws=wb.Sheets[sn];
          var rows=XLSX.utils.sheet_to_json(ws,{header:1});
          if(rows.length<2)return;
          var header=rows[0].map(function(h){return String(h||'').trim();});
          var colMap={};
          ['公司','岗位','类别','城市','学历','薪资','截止','链接','内推'].forEach(function(w){
            var idx=header.findIndex(function(h){return h.indexOf(w)>=0;});
            if(idx>=0)colMap[w]=idx;
          });
          if(Object.keys(colMap).length===0&&header.length>=2){colMap['公司']=0;colMap['岗位']=1;}
          for(var i=1;i<rows.length;i++){
            var r=rows[i];if(!r.some(function(c){return c;}))continue;
            var company=String(r[colMap['公司']||0]||'').trim();
            var title=String(r[colMap['岗位']||1]||'').trim();
            if(!company||!title||company==='nan'||title==='nan')continue;
            if(company.length>30||company.indexOf('公司')>=0&&company.indexOf('岗位')>=0)continue;
            var cat=normCat(String(r[colMap['类别']||2]||'其他'));
            var city=String(r[colMap['城市']||3]||'全国').trim().replace('市','').split('、')[0].slice(0,10);
            if(city==='nan'||!city)city='全国';
            var edu=String(r[colMap['学历']||5]||'本科及以上').trim();
            if(edu==='nan')edu='本科及以上';
            var sal=String(r[colMap['薪资']||4]||'详见岗位描述').trim();
            if(sal==='nan')sal='详见岗位描述';
            var dl=String(r[colMap['截止']||6]||'').trim();
            if(dl==='nan'||!dl)dl=new Date(Date.now()+30*86400000).toISOString().slice(0,10);
            var link=String(r[colMap['链接']||7]||'').trim();
            if(link==='nan')link='';
            var ref=String(r[colMap['内推']||8]||'').trim();
            if(ref==='nan')ref='';
            jobs.push({company:company,title:title,category:cat,city:city,education:edu,salary:sal,deadline:dl,link:link,referralCode:ref,updateTime:new Date().toISOString().slice(0,10)});
          }
        });
        importJobs(jobs);
      }catch(err){document.getElementById('importMsg').textContent='解析失败: '+err.message;}
    };
    reader.readAsArrayBuffer(file);
    return;
  }
  
  // CSV/JSON files
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var text=e.target.result;
      if(name.endsWith('.json')||name.endsWith('.js')){
        var start=text.indexOf('[');var end=text.lastIndexOf(']')+1;
        if(start>=0&&end>start){var arr=JSON.parse(text.substring(start,end));importJobs(arr);return;}
        document.getElementById('importMsg').textContent='JSON格式不正确';return;
      }
      if(name.endsWith('.csv')){
        var lines=text.split('\n').filter(function(l){return l.trim();});
        if(lines.length<2){document.getElementById('importMsg').textContent='CSV格式不正确';return;}
        var arr=[];
        for(var i=1;i<lines.length;i++){
          var cols=parseCSVLine(lines[i]);
          if(cols.length<2)continue;
          var c=(cols[0]||'').replace(/"/g,'').trim(),t=(cols[1]||'').replace(/"/g,'').trim();
          if(!c||!t)continue;
          arr.push({company:c,title:t,category:normCat(cols[2]||''),city:cols[3]||'全国',education:cols[4]||'本科及以上',deadline:cols[5]||new Date(Date.now()+30*86400000).toISOString().slice(0,10),link:cols[7]||'',referralCode:cols[8]||'',salary:'详见岗位描述',updateTime:new Date().toISOString().slice(0,10)});
        }
        importJobs(arr);return;
      }
      document.getElementById('importMsg').textContent='支持 .xlsx .xls .csv .json 格式';
    }catch(err){document.getElementById('importMsg').textContent='解析失败: '+err.message;}
  };
  reader.readAsText(file,'UTF-8');
}

function parseCSVLine(line){
  var result=[],current='',inQuotes=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(inQuotes){if(c==='"'){if(i+1<line.length&&line[i+1]==='"'){current+='"';i++;}else inQuotes=false;}else current+=c;}
    else{if(c==='"')inQuotes=true;else if(c===','){result.push(current.trim());current='';}else current+=c;}
  }
  result.push(current.trim());
  return result;
}

function importJobs(arr){
  var exist=new Set(DATA.map(function(j){return j.company+'|'+j.title;}));
  var added=0,skipped=0;
  arr.forEach(function(j){
    if(!j.company||!j.title)return;
    if(!j.deadline)j.deadline=new Date(Date.now()+30*86400000).toISOString().slice(0,10);
    if(exist.has(j.company+'|'+j.title)){skipped++;return;}
    DATA.unshift(j);added++;
  });
  document.getElementById('importMsg').textContent='✅ 导入 '+added+' 条，跳过 '+skipped+' 条重复';
  buildCatTags();buildCityTags();refresh();
  toast('导入完成：'+added+' 条');
}
